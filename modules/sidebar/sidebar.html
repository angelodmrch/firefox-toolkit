<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sidebar</title>
  <link rel="stylesheet" href="../../core/theme.css">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      flex: 0 0 auto;
      background: #202124;
      color: white;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #333;
      min-height: 32px;
    }

    label {
      font-size: 11px;
      color: #e8e8e8;
      white-space: nowrap;
      font-weight: 500;
    }

    select {
      padding: 3px 6px;
      font-size: 11px;
      border: 1px solid #555;
      border-radius: 3px;
      background: #333;
      color: white;
      flex: 1;
      min-width: 100px;
      cursor: pointer;
      height: 22px;
    }

    select:focus {
      outline: none;
      border-color: #4285f4;
      box-shadow: 0 0 0 1px rgba(66, 133, 244, 0.3);
    }

    .main-content {
      flex: 1;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 13px;
      padding: 20px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header id="header">
    <label for="pageSelect">Site:</label>
    <select id="pageSelect">
      <option value="">Escolha um site...</option>
    </select>
  </header>

  <div class="main-content">
    <p id="message">Escolha um site na lista acima</p>
  </div>

  <script src="../../core/registry.js"></script>
  <script src="../../core/settings.js"></script>
  <script src="sidebar-api.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
